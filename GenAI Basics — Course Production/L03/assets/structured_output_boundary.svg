<svg viewBox="0 0 1200 680" width="1200" height="680" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0e131b; }
      .surface { fill: #141c28; stroke: #253245; stroke-width: 1.5; rx: 8px; }
      .surface-alt { fill: #1b2434; stroke: #364761; stroke-width: 1.5; rx: 6px; }
      .card-red { fill: #1a1215; stroke: #d98585; stroke-width: 1.5; rx: 6px; }
      .card-amber { fill: #1c1811; stroke: #e0c58e; stroke-width: 1.5; rx: 6px; }
      .card-green { fill: #111c17; stroke: #6ee7b7; stroke-width: 1.5; rx: 6px; }
      .text-title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; fill: #f8fafc; font-size: 20px; }
      .text-sub { font-family: 'Inter', -apple-system, sans-serif; font-weight: 400; fill: #94a3b8; font-size: 13px; }
      .text-header { font-family: 'Inter', -apple-system, sans-serif; font-weight: 600; fill: #e2e8f0; font-size: 15px; }
      .text-body { font-family: 'Inter', -apple-system, sans-serif; font-weight: 400; fill: #94a3b8; font-size: 12px; }
      .text-mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #60a5fa; }
      .text-mono-green { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; fill: #6ee7b7; font-weight: bold; }
      .text-mono-amber { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; fill: #e0c58e; font-weight: bold; }
      .text-mono-coral { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; fill: #d98585; font-weight: bold; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" class="bg" />

  <!-- Title Area -->
  <text x="40" y="45" class="text-title">STRUCTURED OUTPUTS EVOLUTION: THE 3 AUTOMATION BOUNDARIES</text>
  <text x="40" y="70" class="text-sub">From Probabilistic Text Generation to Deterministic Constrained Decoding (Grammar Masking)</text>

  <!-- Pillar 1: Prompt Only -->
  <rect x="40" y="100" width="350" height="540" class="card-red" />
  <rect x="55" y="115" width="320" height="34" fill="#2e181c" rx="4" />
  <text x="70" y="137" class="text-mono-coral">LEVEL 1: "PLEASE RETURN JSON"</text>

  <rect x="55" y="165" width="320" height="110" class="surface-alt" />
  <text x="70" y="185" class="text-header" font-size="13px">Prompt Mechanism:</text>
  <text x="70" y="205" class="text-body">• Instructions: "Respond only with valid JSON"</text>
  <text x="70" y="223" class="text-body">• Model output is unconstrained token stream</text>
  <text x="70" y="241" class="text-body">• Zero API schema enforcement</text>
  <text x="70" y="259" class="text-body">• Model frequently adds ```json prefix or suffix</text>

  <rect x="55" y="290" width="320" height="180" class="surface-alt" />
  <text x="70" y="310" class="text-header" font-size="13px">Production Failure Modes:</text>
  <text x="70" y="332" class="text-body">❌ Markdown markdown wrapper syntax: ```json ... ```</text>
  <text x="70" y="352" class="text-body">❌ Conversational prefix: "Sure, here is your JSON:"</text>
  <text x="70" y="372" class="text-body">❌ Trailing commas or missing closing brackets `}`</text>
  <text x="70" y="392" class="text-body">❌ Hallucinated field names: `client_id` vs `userId`</text>
  <text x="70" y="412" class="text-body">❌ Silent enum invention: `status: "pending_review"`</text>
  <text x="70" y="432" class="text-body">❌ json.loads() raises JSONDecodeError at 3 AM</text>

  <rect x="55" y="485" width="320" height="135" fill="#1b1417" stroke="#d98585" stroke-dasharray="3 3" rx="4" />
  <text x="70" y="510" class="text-mono-coral">FAILURE RATE: 5% - 15%</text>
  <text x="70" y="535" class="text-body">Verdict: Unacceptable for automated production pipelines. Breaks downstream microservices without manual human triage.</text>


  <!-- Pillar 2: Post-Validation -->
  <rect x="425" y="100" width="350" height="540" class="card-amber" />
  <rect x="440" y="115" width="320" height="34" fill="#2d2516" rx="4" />
  <text x="455" y="137" class="text-mono-amber">LEVEL 2: RETRY ON VALIDATION</text>

  <rect x="440" y="165" width="320" height="110" class="surface-alt" />
  <text x="455" y="185" class="text-header" font-size="13px">Post-Processing Loop:</text>
  <text x="455" y="205" class="text-body">• Generate unconstrained text</text>
  <text x="455" y="223" class="text-body">• Client runs Pydantic.model_validate_json()</text>
  <text x="455" y="241" class="text-body">• If validation fails, inject error in retry prompt</text>
  <text x="455" y="259" class="text-body">• Loop continues until valid or max retries (3x)</text>

  <rect x="440" y="290" width="320" height="180" class="surface-alt" />
  <text x="455" y="310" class="text-header" font-size="13px">Operational Drawbacks:</text>
  <text x="455" y="332" class="text-body">⚠️ Multiplied latency: 3.2s becomes 9.6s on retries</text>
  <text x="455" y="352" class="text-body">⚠️ Exploding costs: 2x - 3x token consumption</text>
  <text x="455" y="372" class="text-body">⚠️ Rate limit burn: Burns RPM/TPM quota needlessly</text>
  <text x="455" y="392" class="text-body">⚠️ Non-deterministic latency budget violations</text>
  <text x="455" y="412" class="text-body">⚠️ Flaky tests in CI/CD pipeline</text>
  <text x="455" y="432" class="text-body">⚠️ Model can repeat identical schema defect</text>

  <rect x="440" y="485" width="320" height="135" fill="#1e1a14" stroke="#e0c58e" stroke-dasharray="3 3" rx="4" />
  <text x="455" y="510" class="text-mono-amber">FAILURE RATE: 1% - 3% (With 3x Cost)</text>
  <text x="455" y="535" class="text-body">Verdict: Workable fallback for older models without native schema support, but expensive, slow, and resource-wasteful.</text>


  <!-- Pillar 3: Constrained Decoding -->
  <rect x="810" y="100" width="350" height="540" class="card-green" />
  <rect x="825" y="115" width="320" height="34" fill="#162e24" rx="4" />
  <text x="840" y="137" class="text-mono-green">LEVEL 3: CONSTRAINED DECODING</text>

  <rect x="825" y="165" width="320" height="110" class="surface-alt" />
  <text x="840" y="185" class="text-header" font-size="13px">Grammar-Level Token Masking:</text>
  <text x="840" y="205" class="text-body">• JSON Schema converted to Context-Free Grammar (CFG)</text>
  <text x="840" y="223" class="text-body">• During inference, next-token logits are dynamically masked</text>
  <text x="840" y="241" class="text-body">• Impossible for model to sample a syntax-breaking token</text>
  <text x="840" y="259" class="text-body">• Native in OpenAI (strict=True), Gemini, Anthropic Tools</text>

  <rect x="825" y="290" width="320" height="180" class="surface-alt" />
  <text x="840" y="310" class="text-header" font-size="13px">Guaranteed Engineering Properties:</text>
  <text x="840" y="332" class="text-body">✅ 100% syntactically valid JSON every single time</text>
  <text x="840" y="352" class="text-body">✅ Every required field is present and correct type</text>
  <text x="840" y="372" class="text-body">✅ Enum values strictly limited to predefined constants</text>
  <text x="840" y="392" class="text-body">✅ No markdown fences, no conversational conversational chatter</text>
  <text x="840" y="412" class="text-body">✅ Single round-trip: 0 wasted retry tokens or latency</text>
  <text x="840" y="432" class="text-body">✅ Direct deserialization into typed Pydantic objects</text>

  <rect x="825" y="485" width="320" height="135" fill="#14241d" stroke="#6ee7b7" stroke-dasharray="3 3" rx="4" />
  <text x="840" y="510" class="text-mono-green">SYNTAX FAILURE RATE: EXACTLY 0%</text>
  <text x="840" y="535" class="text-body">Verdict: The definitive enterprise standard. Downstream code treats LLM output like a compiled, typed gRPC / REST microservice.</text>
</svg>
